{% extends "base.html" %}
{% block title %}Browse{% endblock %}

{% block content %}
<div class="wrap page">
    <div class="page-head">
        <div><p class="eyebrow">The catalogue</p><h1 style="font-size:clamp(2.2rem,4vw,3.4rem);margin-top:12px">Browse <em>the map</em></h1></div>
        <p class="lede" style="font-size:1rem;max-width:34ch">Find films to like. Every like moves your spot.</p>
    </div>

    <form class="filters" id="filters" role="search">
        <div class="field"><label for="search-input">Title</label><input class="input" id="search-input" type="search" placeholder="Heat, Amélie, anything…"></div>
        <div class="field"><label for="genre-filter">Genre</label><select class="select" id="genre-filter"><option value="">All genres</option></select></div>
        <div class="field"><label for="sort-filter">Order</label>
            <select class="select" id="sort-filter"><option value="popularity">Most popular</option><option value="rating">Best rated</option><option value="year">Newest</option><option value="title">A to Z</option></select></div>
        <button class="btn" type="submit">{% raw %}<svg class="i" aria-hidden="true"><use href="#i-search"/></svg>{% endraw %} Search</button>
    </form>

    <p class="count mono" id="count" aria-live="polite">&nbsp;</p>
    <div class="cards" id="grid"></div>
    <nav class="pager" id="pager" aria-label="Pages"></nav>
</div>
{% endblock %}

{% block extra_js %}
<script>
const $ = id => document.getElementById(id);
let page = 1;

async function load(p = 1) {
    page = p;
    const q = new URLSearchParams({ page: p, per_page: 12, sort: $('sort-filter').value });
    if ($('search-input').value.trim()) q.set('search', $('search-input').value.trim());
    if ($('genre-filter').value) q.set('genre', $('genre-filter').value);
    $('grid').innerHTML = Array.from({ length: 8 }, () => `<div><div class="skel skel--poster"></div><div class="skel skel--line"></div></div>`).join('');
    const { ok, data } = await json('/api/movies?' + q);
    if (!ok) { $('grid').innerHTML = `<div class="empty" style="grid-column:1/-1"><h3>The shelf wouldn’t open.</h3><button class="btn" onclick="load(1)">Try again</button></div>`; return; }
    $('count').textContent = `${data.total} film${data.total === 1 ? '' : 's'} · page ${data.page} of ${Math.max(data.pages, 1)}`;
    $('grid').innerHTML = data.movies.length
        ? data.movies.map((m, i) => cardHTML(m, { i })).join('')
        : `<div class="empty" style="grid-column:1/-1"><h3>No film by that name.</h3><p>Try fewer letters, or clear the genre filter.</p></div>`;
    pager(data.page, data.pages);
}

function pager(cur, total) {
    if (total <= 1) { $('pager').innerHTML = ''; return; }
    const set = new Set([1, total, cur - 1, cur, cur + 1]);
    const nums = [...set].filter(n => n >= 1 && n <= total).sort((a, b) => a - b);
    let html = `<button ${cur === 1 ? 'disabled' : ''} data-p="${cur - 1}" aria-label="Previous page">←</button>`, prev = 0;
    nums.forEach(n => { if (n - prev > 1) html += `<button disabled>…</button>`; html += `<button data-p="${n}" ${n === cur ? 'aria-current="page"' : ''}>${n}</button>`; prev = n; });
    html += `<button ${cur === total ? 'disabled' : ''} data-p="${cur + 1}" aria-label="Next page">→</button>`;
    $('pager').innerHTML = html;
}

(async () => {
    await checkAuth(); await loadFavIds();
    bindCards($('grid'));
    $('pager').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b && !b.disabled) { load(+b.dataset.p); scrollTo({ top: 0, behavior: 'smooth' }); } });
    $('filters').addEventListener('submit', e => { e.preventDefault(); load(1); });
    $('genre-filter').addEventListener('change', () => load(1));
    $('sort-filter').addEventListener('change', () => load(1));
    const { data } = await json('/api/genres');
    (data.genres || []).forEach(g => $('genre-filter').insertAdjacentHTML('beforeend', `<option value="${esc(g)}">${esc(g)}</option>`));
    load(1);
})();
</script>
{% endblock %}
