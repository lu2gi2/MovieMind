{% extends "base.html" %}
{% block title %}My list{% endblock %}

{% block content %}
<div class="wrap page">
    <div class="page-head">
        <div><p class="eyebrow">Where your taste comes from</p><h1 style="font-size:clamp(2.2rem,4vw,3.4rem);margin-top:12px">My <em>list</em></h1></div>
        <p class="lede mono" id="tally" style="font-size:.9rem">&nbsp;</p>
    </div>
    <div class="cards" id="grid"></div>
    <div class="empty" id="empty" hidden>
        <h3>Nothing here yet.</h3>
        <p>Your spot on the map is still dead centre. Like a few films and it will start to lean.</p>
        <a class="btn" href="/browse">Browse films</a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const $ = id => document.getElementById(id);
function refresh() {
    const n = $('grid').children.length;
    $('tally').textContent = n ? `${n} film${n === 1 ? '' : 's'} shaping your taste` : '';
    $('empty').hidden = n > 0;
}
(async () => {
    const auth = await checkAuth();
    if (!auth.authenticated) { location.href = '/login'; return; }
    const { ok, data } = await json('/api/user/favorites');
    if (!ok) { $('grid').innerHTML = ''; $('empty').hidden = false; return; }
    MM.favs = new Set(data.favorites.map(m => m.movie_id));
    $('grid').innerHTML = data.favorites.map((m, i) => cardHTML(m, { i })).join('');
    bindCards($('grid'));
    refresh();
    // when a heart is switched off here, fade the card out of the list
    document.addEventListener('taste:changed', () => {
        [...$('grid').querySelectorAll('.heart')].forEach(h => {
            if (!MM.favs.has(+h.dataset.id)) { const c = h.closest('.card'); c.style.transition = 'opacity 250ms, transform 250ms'; c.style.opacity = 0; c.style.transform = 'scale(.97)'; setTimeout(() => { c.remove(); refresh(); }, 260); }
        });
    });
})();
</script>
{% endblock %}
