{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block bgmode %}strong{% endblock %}

{% block pub %}
<div class="auth">
    <div class="panel">
        <h1>Welcome back</h1>
        <p class="muted" style="margin-bottom:20px">Log in to pick up where you left off.</p>
        <div id="err" class="note note--error" role="alert" hidden></div>
        <form id="form" novalidate>
            <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email" required></div>
            <div class="field"><label for="password">Password</label><input class="input" id="password" type="password" autocomplete="current-password" required></div>
            <button class="btn btn--block" id="go" type="submit">Log in</button>
        </form>
        <p class="alt">New to MovieMind? <a href="/signup">Create an account</a></p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = $('err'), go = $('go'); err.hidden = true;
    const email = $('email').value.trim(), password = $('password').value;
    if (!email || !password) { err.textContent = 'Enter your email and password.'; err.hidden = false; return; }
    go.disabled = true; go.textContent = 'Logging in…';
    const r = await api('/api/auth/login', { method: 'POST', body: { email, password } });
    if (r.ok) { location.href = '/dashboard'; return; }
    err.textContent = r.status === 0 ? 'We couldn’t reach the server. Check your connection and try again.' : (r.data.error || 'That email and password don’t match.');
    err.hidden = false; go.disabled = false; go.textContent = 'Log in';
});
</script>
{% endblock %}
