<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MovieMind{% endblock %} · MovieMind</title>
    <meta name="description" content="Pick films by where your taste sits, then choose how far a mood moves you.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 20'%3E%3Ccircle cx='6' cy='10' r='4.5' fill='%230E6660'/%3E%3Cpath d='M13 10h12m-4-4 4 4-4 4' fill='none' stroke='%231D1B17' stroke-width='1.6'/%3E%3Ccircle cx='29.5' cy='10' r='3.2' fill='none' stroke='%23B8381A' stroke-width='1.8'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- icon sprite: square caps, 1.6px strokes, drawn for this project -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5 3.8 12.3A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8.2 5.7Z"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></symbol>
        <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
        <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
        <symbol id="i-redo" viewBox="0 0 24 24"><path d="M19 8a8 8 0 1 0 1.5 6M19 3v5h-5"/></symbol>
    </svg>

    <header class="site-head">
        <div class="wrap">
            <a class="brand" href="/" aria-label="MovieMind home">
                <svg viewBox="0 0 34 20" aria-hidden="true"><circle cx="6" cy="10" r="4.5" fill="#0E6660"/><path d="M13 10h12m-4-4 4 4-4 4" fill="none" stroke="#1D1B17" stroke-width="1.6"/><circle cx="29.5" cy="10" r="3.2" fill="none" stroke="#B8381A" stroke-width="1.8"/></svg>
                MovieMind
            </a>
            <nav class="nav" aria-label="Main" data-auth="in" hidden>
                <a href="/dashboard">Tonight</a>
                <a href="/browse">Browse</a>
                <a href="/favorites">My list</a>
            </nav>
            <div class="head-end">
                <div data-auth="out" style="display:flex;gap:12px;align-items:center">
                    <a href="/login" class="link-btn" style="text-decoration:none;font-weight:500">Log in</a>
                    <a href="/signup" class="btn btn--sm">Join</a>
                </div>
                <div class="who" data-auth="in" hidden>
                    <button id="who-btn" aria-haspopup="true" aria-expanded="false"><span data-username>you</span> {% raw %}<svg class="i" aria-hidden="true"><use href="#i-down"/></svg>{% endraw %}</button>
                    <div class="who-menu" id="who-menu" hidden>
                        <a href="/profile">Profile</a>
                        <a href="/favorites">My list</a>
                        <button id="logout-btn">Log out</button>
                    </div>
                </div>
                <button class="menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false" data-auth="in" hidden>{% raw %}<svg class="i" aria-hidden="true"><use href="#i-menu"/></svg>{% endraw %}</button>
            </div>
        </div>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-foot">
        <div class="wrap">
            <span>MovieMind — a taste is a place; a mood is a direction.</span>
            <span>Film data <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a> · ratings <a href="https://grouplens.org/datasets/movielens/" target="_blank" rel="noopener">MovieLens</a> · vectors <span class="mono">all-MiniLM-L6-v2</span></span>
        </div>
    </footer>

    <dialog id="movie-dialog" aria-labelledby="dlg-title">
        <button class="dlg-x" aria-label="Close">{% raw %}<svg class="i" aria-hidden="true"><use href="#i-x"/></svg>{% endraw %}</button>
        <div class="dlg"></div>
    </dialog>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
